name: Food Buffer existing-secret authorization audit (read-only)
on:
  push:
    paths:
      - 'scripts/food_buffer_secret_alias_audit.py'
      - '.github/workflows/food-buffer-secret-alias-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FOOD_BUFFER_API_KEY: ${{ secrets.FOOD_BUFFER_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      PCGT_BUFFER_API_KEY: ${{ secrets.PCGT_BUFFER_API_KEY }}
      PC_BUFFER_API_KEY: ${{ secrets.PC_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing aliases against Buffer (no posting, no exposed keys)
        run: python scripts/food_buffer_secret_alias_audit.py

name: Food - Research external cuisine topics (never publish)
on:
  workflow_dispatch:
  schedule:
    - cron: '32 0 * * *' # 07:32 Hanoi time
  push:
    paths:
      - scripts/collect_topic_sources.py
      - config/topic_sources.json
      - .github/workflows/collect-topic-ideas.yml
permissions:
  contents: write
concurrency:
  group: food-external-topic-ideas
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect reference headlines only, no external article copying
        run: python scripts/collect_topic_sources.py
      - name: Save research ideas only, do not publish website or Facebook
        run: |
          if [ -n "$(git status --porcelain -- out/external_topic_ideas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add out/external_topic_ideas.json
            git commit -m "chore(food): refresh external editorial topic ideas"
            git push
          else
            echo "No new topics"
          fi

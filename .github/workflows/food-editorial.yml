name: "ĂN NGON CÓ DEAL — Kiểm tra nội dung miễn phí"
on:
  push:
    paths:
      - ready.json
      - scripts/**
      - tests/**
      - .github/workflows/food-editorial.yml
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'
permissions:
  contents: write
concurrency:
  group: an-ngon-food-feed
  cancel-in-progress: false
jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository riêng của dự án ẩm thực
        uses: actions/checkout@v4
      - name: Chạy kiểm thử tự động (offline, không sửa Site)
        run: python3 -m unittest discover -s tests -v
      - name: Đối chiếu dữ liệu Site và xuất lô staging 100 bài
        run: python3 scripts/prepare_feed.py
      - name: Kiểm tra tệp kết quả
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("out/manifest.json").read_text(encoding="utf-8"))
          print("Bài staging:",data["countReady"])
          print("Bài công khai thực tế trong Site ở lượt kiểm tra:",data["liveArticleCountAtLastAudit"])
          print("Bài thiếu nguồn trực tiếp:",data["missingSources"])
          print("Bài thiếu ảnh có quyền sử dụng:",data["missingImages"])
          print("LÔ CHỜ IMPORT:",data["batches"])
          assert data["sitePublicationConfirmed"] is False
          PY
      - name: Lưu dữ liệu staging khi thay đổi, không đăng Site
        run: |
          if [ -n "$(git status --porcelain -- out/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add out/
            git commit -m "chore(food): validate staging batches and manifest"
            git push
          else
            echo "Không có thay đổi dữ liệu."
          fi

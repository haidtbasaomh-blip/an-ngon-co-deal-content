name: FOOD licensed real-photo candidates ANW-09 (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/find_commons_food_photos.py'
      - '.github/workflows/food-commons-photo-scout.yml'
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search Wikimedia Commons metadata for exact dish photo candidates (no publication)
        run: python scripts/find_commons_food_photos.py
      - name: Save licensing evidence and pending visual review list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-35-licensed-photo-candidates
          path: reports/food-35-commons-photo-candidates.json
          retention-days: 90
          if-no-files-found: warn

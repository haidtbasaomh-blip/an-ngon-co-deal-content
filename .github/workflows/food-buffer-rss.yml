name: Food RSS to Buffer - safe queue

on:
  workflow_dispatch: # Manual verification; publishes only newly approved public articles after verified cutover.
  push:
    branches:
      - main
    paths:
      - 'scripts/food_buffer_rss.py'
      - 'tests/test_food_buffer_dedupe.py'
      - '.github/workflows/food-buffer-rss.yml'
  schedule:
    - cron: '15 2,7,12 * * *' # 09:15, 14:15, 19:15 Vietnam: max one new approved RSS article per run.

permissions:
  contents: write

concurrency:
  group: food-buffer-rss
  cancel-in-progress: false

jobs:
  validate-bridge:
    # Only inspect code. No Buffer credentials, no GraphQL mutations, no Facebook posts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Food Buffer script syntax
        run: python -m py_compile scripts/food_buffer_rss.py
      - name: Run offline anti-duplicate and safety tests
        run: python -m unittest discover -s tests -p 'test_food_buffer_dedupe.py' -v
      - name: Reconcile all live RSS entries without Buffer credentials or writes
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys
          import urllib.request
          sys.path.insert(0,"scripts")
          import food_buffer_rss as bridge
          policy=json.loads(pathlib.Path("config/social_publishing_policy.json").read_text())
          cutover=dt.datetime.fromisoformat(policy["githubBufferCutoverUtc"].replace("Z","+00:00"))
          req=urllib.request.Request(bridge.FEED,headers={"User-Agent":"Food-RSS-ReadOnly-Audit/1"})
          with urllib.request.urlopen(req,timeout=25) as resp:
              data=resp.read(1600001)
          assert len(data)<=1600000
          audit={}
          articles=bridge.read_feed(data,diagnostics=audit)
          audit["atOrBeforeCutover"]=sum(a["published"]<=cutover for a in articles)
          audit["publishedAfterCutover"]=sum(a["published"]>cutover for a in articles)
          audit["bufferWrites"]=0
          audit["siteWrites"]=0
          audit["publisherPolicyUnchanged"]=True
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/food-rss-parser-live-audit.json").write_text(json.dumps(audit,ensure_ascii=False,indent=2)+"\n")
          print("FOOD_RSS_PARSE_LIVE "+json.dumps(audit,ensure_ascii=False),flush=True)
          PY
      - name: Retain read-only RSS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-rss-parser-live-audit
          path: reports/food-rss-parser-live-audit.json
          retention-days: 14
          if-no-files-found: warn
  buffer-food:
    # Never send Facebook posts from feature branches or manual branch dispatch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FOOD_BUFFER_API_KEY: ${{ secrets.FOOD_BUFFER_API_KEY }}
      FOOD_BUFFER_CHANNEL_ID: ${{ vars.FOOD_BUFFER_CHANNEL_ID }}
      FOOD_BUFFER_AUTO_QUEUE: 'true' # Enabled ONLY after owner turned off Zapier RSS publisher; script checks repository cutover and policy first.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile scripts/food_buffer_rss.py
      - name: Add approved public RSS item to Buffer queue only when connected
        run: python scripts/food_buffer_rss.py
      - name: Save anti-duplicate state
        run: |
          if [ -n "$(git status --porcelain data/buffer_food_seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/buffer_food_seen.json
            git commit -m "chore(food): track Buffer queue URLs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
